let CURRENT_LANG = 'th';
try { CURRENT_LANG = localStorage.getItem('amr_lang') === 'en' ? 'en' : 'th'; } catch (e) {}

function i18nT(key, fallback) {
  const dict = I18N[CURRENT_LANG];
  if (dict && Object.prototype.hasOwnProperty.call(dict, key)) return dict[key];
  if (I18N.th && Object.prototype.hasOwnProperty.call(I18N.th, key)) return I18N.th[key];
  return fallback !== undefined ? fallback : '';
}

// แปล markup แบบ static (ปุ่ม/label/หัวตาราง ฯลฯ ที่มี data-i18n* อยู่ในตัว index.html)
// เนื้อหาที่ render จาก JS แบบไดนามิก (ตาราง/การ์ด/toast) เรียก i18nT() ตรงตอน render
// อยู่แล้ว จึงได้ภาษาใหม่ทันทีที่โหลดหน้าใหม่ — ไม่ต้องเรียกฟังก์ชันนี้ซ้ำสำหรับส่วนนั้น
function applyI18nStatic(root) {
  root = root || document;
  root.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    el.textContent = i18nT(key, el.textContent);
  });
  root.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.getAttribute('data-i18n-placeholder');
    el.setAttribute('placeholder', i18nT(key, el.getAttribute('placeholder')));
  });
  root.querySelectorAll('[data-i18n-title]').forEach(el => {
    const key = el.getAttribute('data-i18n-title');
    el.setAttribute('title', i18nT(key, el.getAttribute('title')));
  });
  document.documentElement.setAttribute('lang', CURRENT_LANG === 'en' ? 'en' : 'th');
}

// สลับภาษา — เก็บค่าไว้แล้วรีโหลดหน้า (เหมือน dark/light mode) เพื่อให้เนื้อหาที่ render
// จาก JS ทั้งหมด (ตาราง/การ์ด/dropdown ฯลฯ) กลับมา render ใหม่ด้วยภาษาที่เลือกอย่างถูกต้องทุกจุด
function setLang(lang) {
  const next = lang === 'en' ? 'en' : 'th';
  if (next === CURRENT_LANG) return;
  try { localStorage.setItem('amr_lang', next); } catch (e) {}
  location.reload();
}

function updateLangToggleBtn() {
  const b = document.getElementById('langToggleBtn');
  if (!b) return;
  b.textContent = CURRENT_LANG === 'en' ? 'TH' : 'EN'; // แสดงภาษาที่ "จะสลับไป" เมื่อกด
  b.title = CURRENT_LANG === 'en' ? 'เปลี่ยนเป็นภาษาไทย' : 'Switch to English';
}

document.addEventListener('DOMContentLoaded', () => {
  applyI18nStatic(document);
  updateLangToggleBtn();
  const b = document.getElementById('langToggleBtn');
  if (b) b.addEventListener('click', () => setLang(CURRENT_LANG === 'en' ? 'th' : 'en'));
});
</script>
